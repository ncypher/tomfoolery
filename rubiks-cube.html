<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="refresh" content="2; url=rubiks-cube-pro.html">
	<title>Rubik's Cube - Tomfoolery Games</title>
	<style>
		:root {
			--bg: #0b0e14;
			--panel: #0f1420;
			--border: #1a2233;
			--text: #eaeef5;
			--muted: #9fb0c7;
			--accent: #2251f6;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at center, #1a2233 0%, var(--bg) 70%);
			color: var(--text);
			font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		main {
			width: min(520px, calc(100% - 32px));
			padding: 28px;
			border: 1px solid var(--border);
			border-radius: 16px;
			background: var(--panel);
			text-align: center;
			box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
		}

		h1 {
			margin: 0 0 10px;
			font-size: clamp(2rem, 8vw, 3.4rem);
		}

		p {
			margin: 0 0 20px;
			color: var(--muted);
		}

		a {
			display: inline-block;
			color: white;
			background: var(--accent);
			border-radius: 999px;
			padding: 11px 16px;
			font-weight: 800;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<main>
		<h1>Rubik's Cube</h1>
		<p>The maintained cube lives in the Pro version now. Redirecting you there...</p>
		<a href="rubiks-cube-pro.html">Open Rubik's Cube Pro</a>
	</main>
</body>
</html>
